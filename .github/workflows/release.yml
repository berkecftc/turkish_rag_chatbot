name: Release

# Tag-driven release pipeline:
#   git tag v1.2.3 && git push origin v1.2.3
#
#   build+push (GHCR) ──> image scan ──> deploy staging (auto)
#                                          └──> deploy production (manual approval
#                                               via GitHub environment protection)
#
# Required repo configuration:
#   Environments: "staging", "production" (production: add required reviewers)
#   Secrets (per environment): DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
#   Variable (per environment): DEPLOY_ENABLED=true  (leave unset to skip deploys)

on:
  push:
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  image-scan:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Trivy scan (backend image)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ needs.build-push.outputs.version }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  deploy-staging:
    needs: [build-push, image-scan]
    runs-on: ubuntu-latest
    environment: staging
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/turkish-rag
            ./infra/scripts/deploy.sh ${{ needs.build-push.outputs.version }}

  deploy-production:
    needs: [build-push, image-scan, deploy-staging]
    runs-on: ubuntu-latest
    environment: production   # add required reviewers in repo settings → manual gate
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/turkish-rag
            ./infra/scripts/deploy.sh ${{ needs.build-push.outputs.version }}

groups:
  # ── Availability ────────────────────────────────────────────────────────────
  - name: availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }}) for 2m."

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "PostgreSQL is unreachable"

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Redis is unreachable"

  # ── API performance ────────────────────────────────────────────────────────
  - name: api
    rules:
      - alert: HighAPILatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{handler!~"/metrics|/api/v1/health.*"}[5m])) by (le)
          ) > 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "API p95 latency > 2s for 10m"

      - alert: HighAPIErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "API 5xx error rate above 5%"

  # ── Ingestion / queue ──────────────────────────────────────────────────────
  - name: ingestion
    rules:
      - alert: QueueBacklog
        expr: sum(rabbitmq_queue_messages_ready) > 100
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "RabbitMQ backlog > 100 ready messages for 15m (workers keeping up?)"

      - alert: CeleryTaskFailures
        expr: sum(increase(celery_task_failed_total[15m])) > 3
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "More than 3 Celery task failures in 15m (OCR/ingestion pipeline?)"

      - alert: NoActiveCeleryWorkers
        expr: sum(celery_worker_up) == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "No Celery workers online — ingestion is halted"

  # ── Datastores ─────────────────────────────────────────────────────────────
  - name: datastores
    rules:
      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "PostgreSQL connections above 80% of max_connections"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Redis memory above 90% of maxmemory (semantic cache evictions imminent)"

  # ── Host resources ─────────────────────────────────────────────────────────
  - name: host
    rules:
      - alert: HostOutOfDiskSpace
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/host",fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{mountpoint="/host",fstype!~"tmpfs|overlay"}) < 0.10
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Less than 10% disk space left"

      - alert: HostHighMemory
        expr: |
          (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.92
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Host memory usage above 92%"

      - alert: HostHighCPU
        expr: |
          1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Host CPU above 90% for 15m"

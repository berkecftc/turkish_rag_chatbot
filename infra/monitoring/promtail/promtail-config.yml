# Ships all docker container logs (json-file driver) to Loki, labeled by
# compose service. Structlog JSON from api/worker parses cleanly in Grafana.
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
    pipeline_stages:
      # Surface structlog levels as Loki labels for fast filtering
      - json:
          expressions:
            level: level
            event: event
      - labels:
          level:

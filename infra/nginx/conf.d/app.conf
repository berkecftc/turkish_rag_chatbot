# Edge server for the Turkish RAG platform.
# Cert paths point at /etc/nginx/certs — populated either by
# infra/scripts/gen-self-signed.sh (bootstrap) or Let's Encrypt
# (infra/scripts/init-letsencrypt.sh + certbot sidecar).

upstream frontend_up { server frontend:8080;  keepalive 16; }
upstream api_up      { server api:8000;     keepalive 32; }

# ── HTTP: ACME challenge + redirect to HTTPS ─────────────────────────────────
server {
    listen 80;
    server_name _;

    location /nginx-health { return 200 "ok\n"; }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Mozilla "intermediate" TLS profile
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploads: backend enforces 50MB; give a little headroom here
    client_max_body_size 60m;

    limit_conn perip 30;

    # ── Auth endpoints: strict rate limit (credential stuffing guard) ───────
    location ~ ^/api/v1/auth/(login|refresh)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api_up;
        include /etc/nginx/conf.d/proxy-params.inc;
    }

    # ── SSE streaming: no buffering, long read timeout ───────────────────────
    location /api/v1/rag/chat/stream {
        limit_req zone=api burst=10;
        proxy_pass http://api_up;
        include /etc/nginx/conf.d/proxy-params.inc;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api_up;
        include /etc/nginx/conf.d/proxy-params.inc;
        proxy_read_timeout 120s;
    }

    # ── Grafana (monitoring profile; sub-path) ──────────────────────────────
    # Resolved lazily via Docker DNS so nginx still boots when the
    # monitoring profile is disabled and the grafana host doesn't exist.
    location /grafana/ {
        resolver 127.0.0.11 valid=10s;
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
        include /etc/nginx/conf.d/proxy-params.inc;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ── SPA + static assets ──────────────────────────────────────────────────
    location /assets/ {
        proxy_pass http://frontend_up;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://frontend_up;
        include /etc/nginx/conf.d/proxy-params.inc;
    }
}

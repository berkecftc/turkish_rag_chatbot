[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "turkish-rag-backend"
version = "0.1.0"
description = "Enterprise Turkish RAG platform — backend"
requires-python = ">=3.11"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "email-validator>=2.0",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    # db
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    # cache / queue
    "redis>=5.2",
    "celery>=5.4",
    "kombu>=5.4",
    # auth / security
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.10",
    # ai / rag
    "google-generativeai>=0.8",
    "llama-index-core>=0.12",
    "FlagEmbedding>=1.3",          # BGE-M3 + reranker
    "sentence-transformers>=3.3",
    # document processing
    "pypdf>=5.1",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "paddleocr>=2.9",
    "pytesseract>=0.3",
    "pdf2image>=1.17",
    "pillow>=11.0",
    # storage
    "boto3>=1.35",
    # observability
    "structlog>=24.4",
    "prometheus-fastapi-instrumentator>=7.0",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[project.optional-dependencies]
dev = [
    # test
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "factory-boy>=3.3",
    "faker>=40.19",
    "hypothesis>=6.154",
    "testcontainers>=4.14",
    "locust>=2.44",
    # quality
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    # tooling
    "watchdog>=6.0",
]

# Only `app` is an installable package; `migrations/` is Alembic's
# working directory and must not be packaged.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4"]
ignore = ["S101"]  # allow asserts in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: `Depends()` (and friends) in argument
# defaults is intentional, not a B008 mutable-default bug.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Security",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "app.api.deps.require",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"

# Enforce module boundaries (clean architecture): modules may not import each
# other's internals — only public services + core/domain/infrastructure.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Modules are independent"
type = "independence"
modules = [
    "app.modules.auth",
    "app.modules.tenancy",
    "app.modules.documents",
    "app.modules.ingestion",
    "app.modules.search",
    "app.modules.rag",
    "app.modules.audit",
    "app.modules.admin",
]
# Known, accepted couplings. This is an explicit allowlist: any *new* cross-module
# import still fails CI. Each entry should eventually be replaced by a port in
# `app.domain.ports` or a public service call.
ignore_imports = [
    # Modules enqueue background work through the Celery task registry. The
    # worker layer is a composition root and may depend on every module.
    "app.modules.** -> app.workers.tasks",
    # documents <-> ingestion form a single "document lifecycle" context: an
    # upload creates an IngestionJob, and job queries join Document for
    # per-user ownership checks.
    "app.modules.documents.service -> app.modules.ingestion.models",
    "app.modules.documents.service -> app.modules.ingestion.repository",
    "app.modules.ingestion.repository -> app.modules.documents.models",
    # /auth/me reports the caller's tenant name and slug.
    "app.modules.auth.router -> app.modules.tenancy.models",
]
